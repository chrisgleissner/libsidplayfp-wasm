name: Set up the libsidplayfp WASM build
description: >-
  Toolchain, caches, dependencies, and both WASM engines. Shared by the Verify
  and release workflows so a change to how artifacts are built cannot apply to
  one and not the other.

inputs:
  cache-key-prefix:
    description: Prefix for the immutable source and playback cache key.
    required: true

runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version: 1.3.1

    - uses: actions/setup-node@v7
      with:
        node-version: 24

    - name: Install native comparison and fixture tools
      shell: bash
      run: |
        set -euo pipefail
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          autoconf automake build-essential libtool p7zip-full pkg-config xa65

    - name: Restore immutable source and real-playback caches
      uses: actions/cache@v6
      with:
        path: |
          .cache/upstream
          .cache/native-reference
          .cache/hvsc-85
          .cache/vice-c64-roms
        key: >-
          ${{ inputs.cache-key-prefix }}-${{ runner.os }}-${{
            hashFiles('upstream.json', 'docker/**', 'scripts/**', 'test/helpers/engine-fixtures.ts')
          }}
        restore-keys: |
          ${{ inputs.cache-key-prefix }}-${{ runner.os }}-
          verify-${{ runner.os }}-

    - name: Install dependencies
      shell: bash
      run: bun install --frozen-lockfile

    - name: Pull the emscripten base image
      shell: bash
      run: |
        set -euo pipefail
        # Docker Hub occasionally times out resolving the manifest, which would
        # otherwise fail the build for a reason that has nothing to do with the
        # change under test. Pull it separately, with retries, so a registry
        # hiccup costs a minute rather than a red run.
        IMAGE=$(sed -n 's/^FROM \(.*\)$/\1/p' docker/Dockerfile | head -1)
        for attempt in 1 2 3 4 5; do
          if docker pull "$IMAGE"; then
            exit 0
          fi
          echo "docker pull $IMAGE failed (attempt ${attempt}/5); retrying"
          sleep $((attempt * 15))
        done
        echo "::error::Could not pull $IMAGE after 5 attempts" >&2
        exit 1

    - name: Rebuild both WASM engines from pinned source
      shell: bash
      run: bun run build:wasm

    - name: Build the TypeScript wrapper
      shell: bash
      run: bun run build
