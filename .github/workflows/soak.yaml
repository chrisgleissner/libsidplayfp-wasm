name: Weekly playback soak

on:
  schedule:
    - cron: "17 3 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  soak:
    name: Two-hour dual-engine memory soak
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.1

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Rebuild both WASM engines from pinned source
        run: bun run build:wasm

      - name: Render two virtual hours without WASM heap growth
        env:
          LIBSIDPLAYFP_WASM_SOAK_SECONDS: "7200"
        run: bun run test:soak
