name: Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Build, playback, package, and native parity
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install native comparison and fixture tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf automake build-essential libtool p7zip-full pkg-config xa65

      - name: Restore immutable source and real-playback caches
        uses: actions/cache@v4
        with:
          path: |
            .cache/upstream
            .cache/native-reference
            .cache/hvsc-85
            .cache/vice-c64-roms
          key: >-
            verify-${{ runner.os }}-${{
              hashFiles('upstream.json', 'docker/**', 'scripts/**', 'test/helpers/engine-fixtures.ts')
            }}
          restore-keys: |
            verify-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Rebuild both WASM engines from pinned source
        run: bun run build:wasm

      - name: Build TypeScript wrapper
        run: bun run build

      - name: Run full unit suite with the 95% line-coverage gate
        run: bun run test:coverage

      - name: Upload the verified LCOV report to Codecov
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/lcov.info
          fail_ci_if_error: true
          verbose: true

      - name: Install browser runtime
        run: bunx playwright install --with-deps chromium firefox webkit

      - name: Verify browser loading for both engines
        run: bun run test:browser

      - name: Verify the clean npm payload and Node consumer
        run: bun run check:package

      - name: Compare both WASM engines with native libsidplayfp
        run: bun run test:parity
